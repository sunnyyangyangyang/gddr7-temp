name: Build Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rpmbuild:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install lc and dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y 'dnf-command(copr)' mock createrepo_c rpm-build rpmdevtools spectool python3-pyyaml
          dnf copr enable -y sunnyyang/local-copr
          dnf install -y lc

      - name: Init local repo and build RPM
        shell: bash
        run: |
          set -euo pipefail
          sg mock -c "lc init --repo ~/gddr7-repo"
          sg mock -c "lc build --source . --torepo ~/gddr7-repo"

      - name: Verify RPM artifact exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          matches=(~/gddr7-repo/**/gddr7_temp-*.rpm)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::No gddr7_temp-*.rpm found under ~/gddr7-repo"
            find ~/gddr7-repo -maxdepth 5 -type f -name '*.rpm' || true
            exit 1
          fi
          echo "Found RPM artifact(s):"
          printf '%s\n' "${matches[@]}"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gddr7_temp-rpm
          path: ~/gddr7-repo/**/gddr7_temp-*.rpm
          if-no-files-found: error

  fedora-matrix:
    # Resolve "all actively maintained Fedora versions" at runtime from
    # Bodhi's release API (state == current), so the workflow never needs
    # editing when a new Fedora ships or an old one reaches EOL. On top of
    # that, rawhide (the in-development release) is always included, so
    # kernel breakage is caught before it reaches a stable Fedora.
    runs-on: ubuntu-latest
    outputs:
      fedoras: ${{ steps.resolve.outputs.fedoras }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          fedoras=$(python3 - <<'PY' || true
          import json, re, urllib.request
          rels, page, total = [], 1, None
          while True:
              url = ("https://bodhi.fedoraproject.org/releases/"
                     "?rows_per_page=100&page=%d" % page)
              with urllib.request.urlopen(url, timeout=30) as fh:
                  d = json.load(fh)
              rels.extend(d.get("releases", []))
              total = d.get("total", len(rels))
              if not d.get("releases") or len(rels) >= total:
                  break
              page += 1
          vers = sorted(int(r["name"][1:]) for r in rels
                        if re.fullmatch(r"F\d+", r["name"]) and r.get("state") == "current")
          # Always append the in-development release; docker only tags it as
          # "rawhide" (there is no numbered tag until the release ships).
          print(json.dumps(vers + ["rawhide"]))
          PY
          )
          if [ -z "${fedoras}" ] || [ "${fedoras}" = "[]" ]; then
            # Bodhi API unreachable (or returned nothing) - keep the build
            # checks running on the known-maintained set + rawhide instead
            # of failing the whole PR; update the fallback when Fedoras
            # reach EOL.
            fedoras='[43, 44, "rawhide"]'
            echo "::warning::Bodhi releases API unavailable; using fallback Fedora list ${fedoras}"
          fi
          echo "fedoras=${fedoras}" >> "$GITHUB_OUTPUT"

  ko-compile:
    name: ko-compile (fedora-${{ matrix.fedora }})
    needs: fedora-matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # Dynamically resolved by the fedora-matrix job (Bodhi release API,
        # state == current = actively maintained), plus rawhide, which the
        # resolver always appends for the in-development kernel.
        fedora: ${{ fromJson(needs.fedora-matrix.outputs.fedoras) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers, Rust toolchain and tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y kernel-devel make gcc python3-pyyaml rust
          # The kernel ships prebuilt rust crates (KDIR/rust/*.rmeta) compiled
          # with the exact rustc of its build (CONFIG_RUSTC_VERSION_TEXT).
          # kbuild resolves plain `rustc` via PATH, so during Fedora update
          # windows where the distro rust package is ahead of the last kernel
          # rebuild (e.g. rust 1.98.1 vs a kernel built with 1.98.0) every
          # prelude import fails with E0514. Detect the mismatch and put the
          # exact toolchain (rustup) on the PATH of the following steps.
          KERNEL_VER=$(ls /usr/src/kernels)
          KDIR=/usr/src/kernels/$KERNEL_VER
          # CONFIG_RUSTC_VERSION_TEXT holds the full `rustc --version` output
          # of the compiler the kernel was built with; reduce both sides to
          # the bare version number before comparing.
          RUST_WANT=$(sed -n 's/^CONFIG_RUSTC_VERSION_TEXT="\(.*\)"$/\1/p' $KDIR/.config)
          RUST_WANT=${RUST_WANT#rustc }
          RUST_WANT=${RUST_WANT%% *}
          RUST_HAVE=$(rustc --version | sed 's/^rustc //; s/ .*//')
          echo "kernel $KERNEL_VER built with rustc $RUST_WANT, distro provides $RUST_HAVE"
          if [ -n "$RUST_WANT" ] && [ "$RUST_WANT" != "$RUST_HAVE" ]; then
            dnf install -y rustup
            rustup toolchain install --profile minimal "$RUST_WANT"
            RUSTC_BIN=$(rustup which rustc --toolchain "$RUST_WANT")
            echo "using exact toolchain: $RUSTC_BIN"
            echo "$(dirname "$RUSTC_BIN")" >> "$GITHUB_PATH"
          fi

      - name: Build kernel module (Rust for Linux)
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_VER=$(ls /usr/src/kernels)
          echo "Detected kernel: $KERNEL_VER"
          # Copy the whole tree (minus VCS metadata) and let the repo Makefile
          # be the single source of build truth — it runs codegen from
          # offsets.yaml and then kbuild. No file lists are duplicated here,
          # so adding/renaming sources cannot silently break this job.
          mkdir -p build
          tar --exclude=.git --exclude=build -cf - . | tar -xf - -C build
          cd build
          make modules KVER="${KERNEL_VER}" KDIR="/usr/src/kernels/${KERNEL_VER}"

      - name: Verify kernel module artifact exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f build/gddr7_temp.ko ]; then
            echo "::error::build/gddr7_temp.ko was not produced"
            find build -maxdepth 2 -type f || true
            exit 1
          fi
          echo "Found kernel module:"
          ls -l build/gddr7_temp.ko

      - name: Upload kernel module artifact
        uses: actions/upload-artifact@v4
        with:
          name: gddr7_temp-ko
          path: build/gddr7_temp.ko
          if-no-files-found: error

  ko-gate:
    # Overall gate: a single check context that turns green only when ALL
    # ko-compile matrix jobs (every maintained Fedora + rawhide) succeeded.
    # The "Protect Main Branch" ruleset requires this one context instead of
    # the per-matrix "ko-compile (...)" checks (which a static required-check
    # list cannot track as releases rotate), so the merge decision reduces to
    # one purposeful signal: this module compiled cleanly on every kernel it
    # must run on.
    name: ko-gate
    needs: [ ko-compile ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all ko-compile variants passed
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.ko-compile.result }}"
          echo "ko-compile aggregate result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::ko-gate: not all ko-compile jobs succeeded (result: ${result})"
            exit 1
          fi
          echo "All ko-compile variants (incl. rawhide) succeeded; overall gate GREEN."
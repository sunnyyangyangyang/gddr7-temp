name: Copr Auto Rebuild

on:
  push:
    branches: [ main ]
    paths:
      - 'gddr7_temp-kmod.spec'

# 1. 严格限制 GITHUB_TOKEN 的默认权限为只读
permissions:
  contents: read

jobs:
  trigger-copr-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史，以保障 github.event.before 可查

      - name: Check if Version or Release bumped
        id: check_version
        shell: bash
        run: |
          set -euo pipefail

          # 获取本次 Push/Merge 发生前 main 分支的 Commit SHA
          BEFORE_SHA="${{ github.event.before }}"

          # 防护：如果是新分支建立或初始 Push，before 为全 0，退回使用 HEAD~1
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="HEAD~1"
          fi

          # 从 spec 内容中提取 "Version-Release" 组合字符串（例如 "3.2-1"）
          extract_vr() {
            local spec_content="$1"
            local ver rel
            ver=$(echo "$spec_content" | grep -E '^\s*%global\s+gddr7_temp_version\s+' | awk '{print $3}' || true)
            # 提取 Release 并去除 %{?dist} 后缀
            rel=$(echo "$spec_content" | grep -E '^\s*Release:\s+' | awk '{print $2}' | sed 's/%{.*}//g' || true)
            echo "${ver}-${rel}"
          }

          OLD_SPEC=$(git show "$BEFORE_SHA":gddr7_temp-kmod.spec 2>/dev/null || true)
          NEW_SPEC=$(cat gddr7_temp-kmod.spec 2>/dev/null || true)

          OLD_VR=$(extract_vr "$OLD_SPEC")
          NEW_VR=$(extract_vr "$NEW_SPEC")

          echo "Previous Version-Release: '$OLD_VR'"
          echo "Current  Version-Release: '$NEW_VR'"

          if [ -n "$NEW_VR" ] && [ "$OLD_VR" != "$NEW_VR" ]; then
            echo "Version or Release bumped from '$OLD_VR' to '$NEW_VR'."
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version and Release unchanged. Skipping Copr rebuild."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Poke Copr Custom Webhook
        if: steps.check_version.outputs.bumped == 'true'
        run: |
          # 使用 -fsSL 静默失败、防 URL/凭据泄露，绝不 echo 环境变量
          curl -fsSL -X POST "$COPR_WEBHOOK_URL"
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}